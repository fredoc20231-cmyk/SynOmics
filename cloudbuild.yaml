# ==============================================================================
# Google Cloud Build CI/CD Pipeline: SynOmics
# Build -> real test gates -> image build/push -> staging Helm -> prod Cloud Run.
#
# ZERO-HALLUCINATION NOTE: this pipeline runs the repository's REAL test suites
# (the same ones enforced in .github/workflows/ci.yml). There is no fabricated
# "100% pass" step — a build fails iff a real test fails. If a stage cannot run
# in a given environment it fails honestly rather than reporting a fake success.
# ==============================================================================

steps:
  # Step 1: Type-check, build, and run the REAL fast test gates.
  - name: 'node:20-bookworm-slim'
    id: 'build-and-test'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        set -euo pipefail
        apt-get update && apt-get install -y --no-install-recommends python3 python3-pip
        npm ci
        npm run lint                       # tsc --noEmit
        npm run build                      # vite build + esbuild -> dist/server.mjs
        python3 -m pip install --break-system-packages --quiet numpy scipy scikit-learn statsmodels biopython networkx
        python3 tests/engine_smoke.py      # real engine computation, asserts values
        npx tsx tests/agent_smoke.ts       # real agent tool-use loop
        npx tsx tests/server_integration.ts # boots dist/server.mjs, real HTTP stack

  # Step 2: Build the multi-image worker set.
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-api-dispatcher'
    waitFor: ['build-and-test']
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/synomics-api-dispatcher:$SHORT_SHA',
           '-t', 'gcr.io/$PROJECT_ID/synomics-api-dispatcher:latest',
           '-f', 'docker/Dockerfile.api-dispatcher', '.']

  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-bioconda-engine'
    waitFor: ['build-and-test']
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/synomics-bioconda-engine:$SHORT_SHA',
           '-t', 'gcr.io/$PROJECT_ID/synomics-bioconda-engine:latest',
           '-f', 'docker/Dockerfile.base-bioconda', '.']

  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-gvisor-sandbox'
    waitFor: ['build-and-test']
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/synomics-gvisor-sandbox:$SHORT_SHA',
           '-t', 'gcr.io/$PROJECT_ID/synomics-gvisor-sandbox:latest',
           '-f', 'docker/Dockerfile.sandbox-gvisor', '.']

  # Step 3: Push all images to Artifact Registry.
  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-images'
    waitFor: ['build-api-dispatcher', 'build-bioconda-engine', 'build-gvisor-sandbox']
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        set -euo pipefail
        docker push --all-tags gcr.io/$PROJECT_ID/synomics-api-dispatcher
        docker push --all-tags gcr.io/$PROJECT_ID/synomics-bioconda-engine
        docker push --all-tags gcr.io/$PROJECT_ID/synomics-gvisor-sandbox

  # Step 4: Staging deployment via Helm.
  - name: 'gcr.io/cloud-builders/helm'
    id: 'deploy-staging-helm'
    waitFor: ['push-images']
    args: ['upgrade', '--install', 'synomics-staging', 'k8s/helm/synomics-chart',
           '--set', 'global.environment=staging',
           '--set', 'cpuWorker.image.tag=$SHORT_SHA']

  # Step 5: Production promotion to Cloud Run.
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'deploy-production-cloud-run'
    waitFor: ['deploy-staging-helm']
    entrypoint: 'gcloud'
    args: ['run', 'deploy', 'synomics-api-dispatcher',
           '--image', 'gcr.io/$PROJECT_ID/synomics-api-dispatcher:$SHORT_SHA',
           '--region', '${_REGION}', '--platform', 'managed']

substitutions:
  _REGION: 'us-central1'

options:
  machineType: 'E2_HIGHCPU_8'
  logging: CLOUD_LOGGING_ONLY

timeout: '2400s'
