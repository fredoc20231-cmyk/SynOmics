# ==============================================================================
# Kubernetes Deployments: Heterogeneous Multi-Omics Compute Workers
# Strict Resource Quotas, Security Contexts, and Hardware Taints/Tolerations
# ==============================================================================

# 1. CPU-Optimized Bioinformatics Worker (BWA, GATK, FASTQ, PLINK2)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: synomics-cpu-worker
  namespace: default
  labels:
    app.kubernetes.io/name: synomics-cpu-worker
    synomics.ai/tier: cpu-bioinformatics
spec:
  replicas: {{ .Values.cpuWorker.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: synomics-cpu-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: synomics-cpu-worker
        synomics.ai/tier: cpu-bioinformatics
    spec:
      nodeSelector:
{{ toYaml .Values.cpuWorker.nodeSelector | indent 8 }}
      tolerations:
{{ toYaml .Values.cpuWorker.tolerations | indent 8 }}
      containers:
        - name: cpu-engine
          image: "{{ .Values.cpuWorker.image.repository }}:{{ .Values.cpuWorker.image.tag }}"
          imagePullPolicy: {{ .Values.cpuWorker.image.pullPolicy }}
          ports:
            - containerPort: 50051
              name: grpc
          resources:
{{ toYaml .Values.cpuWorker.resources | indent 12 }}
          volumeMounts:
            - name: scratch-volume
              mountPath: /mnt/scratch
          securityContext:
            readOnlyRootFilesystem: false
            runAsNonRoot: true
            runAsUser: 10001
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: scratch-volume
          persistentVolumeClaim:
            claimName: synomics-scratch-pvc
---
