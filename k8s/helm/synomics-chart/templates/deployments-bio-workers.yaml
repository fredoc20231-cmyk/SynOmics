# 4. gVisor Micro-VM Sandbox Worker (sandbox_execute)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: synomics-gvisor-sandbox
  namespace: default
  labels:
    app.kubernetes.io/name: synomics-gvisor-sandbox
    synomics.ai/tier: untrusted-sandbox
spec:
  replicas: {{ .Values.sandboxWorker.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: synomics-gvisor-sandbox
  template:
    metadata:
      labels:
        app.kubernetes.io/name: synomics-gvisor-sandbox
        synomics.ai/tier: untrusted-sandbox
    spec:
      runtimeClassName: {{ .Values.sandboxWorker.runtimeClassName }}
      nodeSelector:
{{ toYaml .Values.sandboxWorker.nodeSelector | indent 8 }}
      tolerations:
{{ toYaml .Values.sandboxWorker.tolerations | indent 8 }}
      containers:
        - name: gvisor-sandbox
          image: "{{ .Values.sandboxWorker.image.repository }}:{{ .Values.sandboxWorker.image.tag }}"
          imagePullPolicy: {{ .Values.sandboxWorker.image.pullPolicy }}
          resources:
{{ toYaml .Values.sandboxWorker.resources | indent 12 }}
          securityContext:
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 9999
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
