# ==============================================================================
# GKE gVisor RuntimeClass for Secure Micro-VM Sandboxing
# ==============================================================================
apiVersion: node.k8s.io/v1
kind: RuntimeClass
metadata:
  name: gvisor
handler: gvisor
scheduling:
  nodeSelector:
    "synomics.ai/hardware-tier": "sandbox-gvisor"
  tolerations:
    - key: "workload"
      operator: "Equal"
      value: "untrusted-sandbox"
      effect: "NoSchedule"
