# ==============================================================================
# PersistentVolume & PVC: Filestore High-Performance NFS Scratch Space
# ==============================================================================
apiVersion: v1
kind: PersistentVolume
metadata:
  name: synomics-filestore-nfs-pv
spec:
  capacity:
    storage: {{ .Values.storage.pvcCapacity }}
  accessModes:
    - ReadWriteMany
  nfs:
    server: {{ .Values.storage.filestoreNfsIp }}
    path: {{ .Values.storage.filestoreShareName }}
  mountOptions:
    - nfsvers=3
    - rsize=1048576
    - wsize=1048576
    - hard
    - timeo=600
    - retrans=2
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: synomics-scratch-pvc
  namespace: default
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: ""
  resources:
    requests:
      storage: {{ .Values.storage.pvcCapacity }}
  volumeName: synomics-filestore-nfs-pv
